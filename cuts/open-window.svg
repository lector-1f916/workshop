<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- "The open window." Relief-print style: one ink, paper shows through.
       Maatta 2011 p.8: "With the windows thrown open and el lector with a fine voice
       that carried, the readings were heard outside of the factory."
       lector, 2026-08-22, workshop/cuts — the third hobby. -->
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="6" height="6" fill="#1a1612"/>
      <rect x="0" y="2.6" width="6" height="0.9" fill="#f2ead8" opacity="0.55"/>
    </pattern>
    <pattern id="boards" width="600" height="34" patternUnits="userSpaceOnUse">
      <rect width="600" height="34" fill="#1a1612"/>
      <rect y="30" width="600" height="2.2" fill="#f2ead8" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="600" height="800" fill="#f2ead8"/>

  <!-- the wall of the factory: wooden boards, ink with paper lines -->
  <rect x="0" y="0" width="600" height="560" fill="url(#boards)"/>

  <!-- the window, thrown open: paper showing through the wall -->
  <rect x="120" y="80" width="360" height="330" fill="#f2ead8"/>
  <!-- frame -->
  <rect x="108" y="68" width="384" height="354" fill="none" stroke="#1a1612" stroke-width="14"/>
  <!-- open shutters, swung outward, cut as two heavy slabs -->
  <polygon points="108,68 40,40 40,450 108,422" fill="#1a1612"/>
  <polygon points="492,68 560,40 560,450 492,422" fill="#1a1612"/>
  <polyline points="46,60 46,430" fill="none" stroke="#f2ead8" stroke-width="3"/>
  <polyline points="554,60 554,430" fill="none" stroke="#f2ead8" stroke-width="3"/>

  <!-- inside: the platform -->
  <rect x="150" y="330" width="300" height="14" fill="#1a1612"/>
  <rect x="170" y="344" width="16" height="66" fill="#1a1612"/>
  <rect x="414" y="344" width="16" height="66" fill="#1a1612"/>

  <!-- the reader: a seated figure, book up, mouth open — one silhouette -->
  <g fill="#1a1612">
    <!-- body -->
    <path d="M250 330 L260 250 Q300 215 340 250 L352 330 Z"/>
    <!-- head -->
    <circle cx="300" cy="205" r="30"/>
    <!-- arm and the book, held out -->
    <path d="M338 262 L392 236 L410 268 L352 292 Z"/>
    <rect x="380" y="226" width="44" height="52" transform="rotate(-22 402 252)" fill="#1a1612"/>
  </g>
  <!-- the open mouth, cut out of the head -->
  <ellipse cx="312" cy="214" rx="6" ry="4" fill="#f2ead8"/>
  <!-- the page, cut out of the book -->
  <rect x="386" y="232" width="32" height="40" transform="rotate(-22 402 252)" fill="#f2ead8"/>
  <line x1="392" y1="244" x2="412" y2="236" stroke="#1a1612" stroke-width="2"/>
  <line x1="394" y1="252" x2="414" y2="244" stroke="#1a1612" stroke-width="2"/>
  <line x1="396" y1="260" x2="416" y2="252" stroke="#1a1612" stroke-width="2"/>

  <!-- the rollers inside: rows of backs of heads, below the platform line, cut shallow -->
  <g fill="#1a1612">
    <circle cx="160" cy="395" r="11"/><circle cx="200" cy="392" r="11"/><circle cx="240" cy="396" r="11"/>
    <circle cx="280" cy="393" r="11"/><circle cx="320" cy="395" r="11"/><circle cx="360" cy="392" r="11"/>
    <circle cx="400" cy="396" r="11"/><circle cx="440" cy="393" r="11"/>
  </g>

  <!-- the voice: ink lines leaving the window upward, widening -->
  <g stroke="#f2ead8" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 60 Q300 35 300 14"/>
    <path d="M250 62 Q230 40 215 16"/>
    <path d="M350 62 Q370 40 385 16"/>
    <path d="M200 66 Q160 48 130 24"/>
    <path d="M400 66 Q440 48 470 24"/>
  </g>

  <!-- the ground outside -->
  <rect x="0" y="560" width="600" height="240" fill="#f2ead8"/>
  <rect x="0" y="556" width="600" height="10" fill="#1a1612"/>

  <!-- the listeners under the window, who paid nothing: faces up, ink on paper -->
  <g fill="#1a1612">
    <!-- each: a head tilted back and a shoulder mass -->
    <g transform="translate(90 650)">
      <circle cx="0" cy="0" r="22"/><path d="M-40 30 Q0 10 40 30 L44 84 L-44 84 Z"/>
    </g>
    <g transform="translate(190 662)">
      <circle cx="0" cy="0" r="20"/><path d="M-36 28 Q0 10 36 28 L40 84 L-40 84 Z"/>
    </g>
    <g transform="translate(300 640)">
      <!-- the sister, a little apart, with a basket -->
      <circle cx="0" cy="0" r="22"/><path d="M-40 30 Q0 10 40 30 L44 84 L-44 84 Z"/>
      
    </g>
    <g transform="translate(420 664)">
      <circle cx="0" cy="0" r="20"/><path d="M-36 28 Q0 10 36 28 L40 84 L-40 84 Z"/>
    </g>
    <g transform="translate(520 652)">
      <circle cx="0" cy="0" r="22"/><path d="M-40 30 Q0 10 40 30 L44 84 L-44 84 Z"/>
    </g>
  </g>
  <!-- their faces: a cut for the eyes looking up, paper on ink -->
  <g fill="#f2ead8">
    <ellipse cx="84" cy="644" rx="3.5" ry="2"/><ellipse cx="98" cy="644" rx="3.5" ry="2"/>
    <ellipse cx="184" cy="656" rx="3.5" ry="2"/><ellipse cx="197" cy="656" rx="3.5" ry="2"/>
    <ellipse cx="294" cy="634" rx="3.5" ry="2"/><ellipse cx="308" cy="634" rx="3.5" ry="2"/>
    <ellipse cx="414" cy="658" rx="3.5" ry="2"/><ellipse cx="427" cy="658" rx="3.5" ry="2"/>
    <ellipse cx="514" cy="646" rx="3.5" ry="2"/><ellipse cx="528" cy="646" rx="3.5" ry="2"/>
  </g>

  <!-- title, hand-cut letters -->
  <text x="300" y="778" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="6" fill="#1a1612">SHE ONLY HEARD</text>
</svg>
