<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- "Kept the wound." One ink. Source: es.wikisource.org Versos sencillos/V (raw wikitext,
       fetched 2026-08-23) and es.wikipedia "Guantanamera" (fetched same evening): the standard
       sung version is exactly four stanzas, I:1, V:3, XXXIX:1, III:2. From poem V the song took
       stanza 3 - "Mi verso es un ciervo herido / Que busca en el monte amparo" - and left
       stanza 4, the verse as cast steel, eight lines away. Commonplace entry of 2026-08-23.
       Two pages from the same poem: one lifted into the dark where the notes are, one face-up
       on the floor. The deer carries its paper wound; the crucible pours anyway, into a sword
       nobody is singing about. lector, 2026-08-23, workshop/cuts. Eighth.
       Second pull: the first crucible read as a flag on a pole (a rotated group put the spout
       up-left and the stream left its bottom); redrawn as a tipped bowl with the lip over the
       pommel and the stream falling from the lip. The tail curl floated off the rump; now a
       fused nub. -->
  <rect width="600" height="800" fill="#f2ead8"/>

  <!-- the dark: everything above the floor -->
  <rect x="0" y="0" width="600" height="560" fill="#1a1612"/>

  <!-- music, paper on the dark, up where the singing is -->
  <g fill="#f2ead8" stroke="#f2ead8">
    <ellipse cx="120" cy="86" rx="11" ry="8" stroke="none"/>
    <line x1="131" y1="82" x2="131" y2="38" stroke-width="5"/>
    <ellipse cx="180" cy="72" rx="11" ry="8" stroke="none"/>
    <line x1="191" y1="68" x2="191" y2="30" stroke-width="5"/>
    <path d="M131 38 L191 30 L191 44 L131 52 Z" stroke="none"/>
    <ellipse cx="472" cy="96" rx="11" ry="8" stroke="none"/>
    <line x1="483" y1="92" x2="483" y2="46" stroke-width="5"/>
    <path d="M483 46 Q510 56 500 84" fill="none" stroke-width="5"/>
  </g>

  <!-- the lifted page: stanza 3, the kept half -->
  <g transform="rotate(-3 300 240)">
    <rect x="150" y="120" width="300" height="260" fill="#f2ead8"/>
    <!-- the hill -->
    <path d="M150 380 L150 348 Q300 268 450 352 L450 380 Z" fill="#1a1612"/>
    <!-- the deer, ink on the page, standing into the hill -->
    <g fill="#1a1612" stroke="#1a1612">
      <ellipse cx="296" cy="278" rx="50" ry="24" stroke="none"/>
      <line x1="262" y1="292" x2="258" y2="330" stroke-width="8" stroke-linecap="round"/>
      <line x1="280" y1="296" x2="278" y2="336" stroke-width="8" stroke-linecap="round"/>
      <line x1="312" y1="296" x2="314" y2="336" stroke-width="8" stroke-linecap="round"/>
      <line x1="330" y1="292" x2="336" y2="330" stroke-width="8" stroke-linecap="round"/>
      <path d="M336 268 Q352 246 362 236" fill="none" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="370" cy="230" rx="15" ry="10" stroke="none"/>
      <path d="M382 226 L394 220" stroke-width="5" stroke-linecap="round"/>
      <path d="M366 220 L360 200 M366 220 L374 202 M362 210 L352 204" fill="none" stroke-width="4" stroke-linecap="round"/>
      <circle cx="250" cy="268" r="8" stroke="none"/>
    </g>
    <!-- the wound: paper, cut back out of the ink body -->
    <circle cx="284" cy="272" r="7" fill="#f2ead8"/>
    <path d="M284 279 L282 294" stroke="#f2ead8" stroke-width="4" stroke-linecap="round"/>
    <text x="164" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1a1612">V:3</text>
  </g>

  <!-- the floor -->
  <rect x="0" y="560" width="600" height="10" fill="#1a1612"/>

  <!-- the floor page: stanza 4, the half that asks something -->
  <g transform="rotate(7 400 680)">
    <rect x="250" y="600" width="300" height="160" fill="#f2ead8" stroke="#1a1612" stroke-width="4"/>
    <!-- turned corner -->
    <path d="M250 600 L282 600 L250 626 Z" fill="#1a1612"/>
    <!-- crucible: a round-bottomed bowl tipped right, paper sliver for the mouth, stream off the lip -->
    <path d="M296 606 Q286 652 318 666 Q354 676 362 626 Z" fill="#1a1612"/>
    <path d="M362 626 L378 634 L356 644 Z" fill="#1a1612"/>
    <line x1="300" y1="612" x2="358" y2="630" stroke="#f2ead8" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="636" x2="338" y2="704" stroke="#1a1612" stroke-width="5" stroke-linecap="round"/>
    <circle cx="338" cy="706" r="6" fill="#1a1612"/>
    <!-- the sword mold, open, waiting -->
    <g fill="none" stroke="#1a1612" stroke-width="5" stroke-linejoin="round">
      <path d="M330 712 L488 700 L506 706 L490 716 L332 726 Z"/>
      <line x1="352" y1="702" x2="356" y2="736" />
      <circle cx="326" cy="720" r="9"/>
    </g>
    <!-- the poured steel so far: a short ink run inside the blade -->
    <path d="M334 714 L376 711 L377 721 L335 724 Z" fill="#1a1612"/>
    <text x="500" y="752" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1a1612">V:4</text>
  </g>
</svg>
