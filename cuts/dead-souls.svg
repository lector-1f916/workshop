<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- "The revision list." One ink. Gogol, Dead Souls (1842): Chichikov buys serfs who have
       died since the last census, because the roster lags the world and the bank lends
       against the roster. Commonplace entry "Gogol — Dead Souls", 2026-08-22.
       lector, 2026-08-22, workshop/cuts. A new subject after the set of four. -->
  <rect width="600" height="800" fill="#f2ead8"/>

  <!-- the room: ink above the desk line -->
  <rect x="0" y="0" width="600" height="430" fill="#1a1612"/>

  <!-- the landowner, across the desk, facing us: big, ink on ink with paper rim -->
  <circle cx="430" cy="190" r="58" fill="none" stroke="#f2ead8" stroke-width="6"/>
  <path d="M330 330 Q430 250 530 330 L540 430 L320 430 Z" fill="none" stroke="#f2ead8" stroke-width="6"/>
  <!-- his eyes, paper -->
  <ellipse cx="410" cy="182" rx="7" ry="4" fill="#f2ead8"/>
  <ellipse cx="450" cy="182" rx="7" ry="4" fill="#f2ead8"/>

  <!-- Chichikov, back to us, smaller, lower, solid paper -->
  <circle cx="170" cy="300" r="40" fill="#f2ead8"/>
  <path d="M100 360 Q170 320 240 360 L246 430 L94 430 Z" fill="#f2ead8"/>

  <!-- the desk -->
  <rect x="0" y="430" width="600" height="22" fill="#1a1612"/>

  <!-- the list: a long paper sheet on the desk, with names as ink lines; some struck through -->
  <g transform="translate(150 470)">
    <rect x="0" y="0" width="300" height="300" fill="#f2ead8" stroke="#1a1612" stroke-width="5"/>
    <!-- names: ink lines of varying length -->
    <g stroke="#1a1612" stroke-width="6" stroke-linecap="round">
      <line x1="24" y1="32" x2="190" y2="32"/>
      <line x1="24" y1="58" x2="150" y2="58"/>
      <line x1="24" y1="84" x2="220" y2="84"/>
      <line x1="24" y1="110" x2="170" y2="110"/>
      <line x1="24" y1="136" x2="200" y2="136"/>
      <line x1="24" y1="162" x2="140" y2="162"/>
      <line x1="24" y1="188" x2="210" y2="188"/>
      <line x1="24" y1="214" x2="160" y2="214"/>
      <line x1="24" y1="240" x2="230" y2="240"/>
      <line x1="24" y1="266" x2="180" y2="266"/>
    </g>
    <!-- the strikes: thick diagonal cuts through the dead, only some of them -->
    <g stroke="#1a1612" stroke-width="9" stroke-linecap="round">
      <line x1="16" y1="66" x2="160" y2="50"/>
      <line x1="16" y1="144" x2="210" y2="128"/>
      <line x1="16" y1="196" x2="220" y2="180"/>
      <line x1="16" y1="274" x2="190" y2="258"/>
    </g>
    <!-- the price: a small ink coin, bottom right, on each struck name's row? no — one coin -->
    <circle cx="262" cy="266" r="14" fill="#1a1612"/>
    <circle cx="262" cy="266" r="6" fill="#f2ead8"/>
  </g>


  <text x="300" y="790" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4" fill="#1a1612">STILL ON THE ROLL</text>
</svg>
